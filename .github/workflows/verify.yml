name: Verification

on:
  workflow_call:
    outputs:
      artifact_id:
        description: Same-run dist artifact, usable only after verification succeeds
        value: ${{ jobs.build.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.dist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:static
      - run: node scripts/artifact-manifest.mjs write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: dist
        with:
          name: verified-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            artifact-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  browsers:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # WebKit is slowest; give each engine its own shards so none trails the rest.
        engine:
          - name: chromium
            projects: --project=desktop-chromium --project=desktop-dark --project=mobile-chromium --project=narrow-chromium
          - name: webkit
            projects: --project=mobile-webkit
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Use official Ubuntu archive
        run: sudo -n "$(command -v node)" scripts/use-ubuntu-archive.mjs
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine.name }}
        timeout-minutes: 5
      - name: Require the exact build artifact
        env:
          VERIFY_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: '[[ "$VERIFY_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
      - run: node scripts/artifact-manifest.mjs verify
      - run: pnpm run test:browser ${{ matrix.engine.projects }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-${{ matrix.engine.name }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  extension:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Use official Ubuntu archive
        run: sudo -n "$(command -v node)" scripts/use-ubuntu-archive.mjs
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Require the exact build artifact
        env:
          VERIFY_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: '[[ "$VERIFY_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
      - run: node scripts/artifact-manifest.mjs verify
      - run: pnpm run test:extension

  verify:
    name: Complete verification
    if: always()
    needs: [build, browsers, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          VERIFY_BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_BROWSER_RESULT: ${{ needs.browsers.result }}
          VERIFY_EXTENSION_RESULT: ${{ needs.extension.result }}
        run: |
          test "$VERIFY_BUILD_RESULT" = success
          test "$VERIFY_BROWSER_RESULT" = success
          test "$VERIFY_EXTENSION_RESULT" = success
