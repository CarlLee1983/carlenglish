name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Deploy verifies main before publishing; retain CI when deployment is disabled.
    if: github.event_name == 'pull_request' || vars.CLOUDFLARE_DEPLOY_ENABLED != 'true'
    uses: ./.github/workflows/verify.yml
